# Relanzado automático de tarjetas bloqueadas por fallos transitorios (agent_lanes/relanzar.py). Se relee en cada pasada:
# no hace falta reiniciar el runner. Lo que falte o no sea válido vale el default que se indica.
# APAGADO POR DEFECTO: relanzar de forma automática puede disparar bucles o gasto; lo enciende la Integradora u Oscar.
# Con `activo: true` el runner relanza, como mucho `max_por_pasada` tarjetas por ciclo, la bloqueada MÁS ANTIGUA que cumpla
# TODO: hueco bajo el tope de running, último bloqueo `transient`, motivo sin marcas de exclusión, asignada a un carril de
# código (kind: implement), fuera de triage y sin haberse relanzado ya `max_auto_por_tarjeta` veces
# (contador en .state/relanzar.json). Nunca toca needs_input NI una tarjeta que ya tenga la rama lane/<id> en el remoto: esa se integra, no se rehace. Comenta «RELANZADA AUTOMÁTICAMENTE (n/max): <motivo>».
activo: false
tope_running: 3               # tarjetas en running en TODOS los tableros; con este número o más no se relanza
max_por_pasada: 1
max_auto_por_tarjeta: 1       # relanzados automáticos por tarjeta; el siguiente bloqueo lo decide una persona
excluir_motivos:              # si el motivo contiene alguna (sin mayúsculas ni tildes) no se relanza
  - "CONFIGURACIÓN"
  - "LIMITACION-GUARD"
  - "producción"
  - "migración"
