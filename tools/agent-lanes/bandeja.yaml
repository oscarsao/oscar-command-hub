# Ajustes de la bandeja de decisiones (/decisiones y recordatorios de las 13:00 y 18:00).
# Se leen al arrancar el runner-servicio (hace falta [🔁 Aplicar] tras editarlos). Si falta el fichero, o un valor
# no es válido, se usa el valor por defecto de aquí abajo. No viven en lanes.yaml a propósito.

# Tarjetas que se muestran de golpe; el resto sale como "➕ N más · ver todas" agrupado por origen.
top: 5

# Agrupar tarjetas repetidas (mismo título sin etiquetas + mismo origen) en una sola.
dedupe: true

# Auto-aplazar tarjetas de PRIORIDAD BAJA que llevan esperando más de `autosnooze_dias` días (0 = desactivado).
# Prioridad baja = prioridad del kanban NEGATIVA y <= `prioridad_baja_max`. Las de prioridad 0 (la de por defecto) o sin
# informar nunca se aplazan solas.
# Se aplazan `autosnooze_aplazar_dias` días, con un único aviso; una aplazada no vuelve a salir hasta entonces.
autosnooze_dias: 14
autosnooze_aplazar_dias: 7
prioridad_baja_max: -1

# Plazo de veto de las decisiones reversibles (la tarjeta lleva la línea `Reversible: sí` y una recomendada).
# Pasadas `veto_horas` horas sin respuesta de Oscar (0 = desactivado):
#   aviso    -> solo avisa de que se habría aplicado la recomendada (no ejecuta nada). Modo inicial.
#   ejecutar -> aplica la recomendada sola. Solo cuando Oscar lo active aquí, tras ver el modo aviso funcionar.
veto_horas: 48
veto_modo: aviso

# Resumen de las 8:00 y /hoy: por cada carril, una línea con lo hecho ayer, lo bloqueado y lo que espera a Oscar.
resumen_carriles: true
# Añade el coste estimado de IA (por carril y total de ayer) cuando los datos de las ejecuciones lo traen.
# false = ni el coste por carril ni la línea "Coste de ayer".
resumen_coste: true

# Caducidad de lo que espera a Oscar (preguntas, «tuyo» y «decidir»; agent_lanes/caducidad.py). Decisión de Oscar 16-11:
# una tarjeta se recuerda como mucho una vez cada `recordatorio_cada_horas` h, `recordatorio_veces` veces, contadas desde
# que empezó a esperarte (cada aviso dice cuántos quedan). Pasadas esas, UN aviso «¿Sigue vigente?» con [Archivar]
# [Aplazar N d] [Mantener N d]; sin respuesta en `vigente_responde_horas` h se aplaza `vigente_aplazar_dias` días.
# Las que ya llevaban más de `vigente_legado_dias` días esperando al estrenar esto van directas a «¿Sigue vigente?»,
# como mucho `vigente_tanda_dia` por día. «Mantener» no las oculta: solo reinicia el contador tras `vigente_mantener_dias`.
caducidad: true               # false = sin recordatorios por tarjeta ni «¿Sigue vigente?»
recordatorio_cada_horas: 24
recordatorio_veces: 3
vigente_legado_dias: 7
vigente_tanda_dia: 5
vigente_responde_horas: 24
vigente_aplazar_dias: 30
vigente_mantener_dias: 7
