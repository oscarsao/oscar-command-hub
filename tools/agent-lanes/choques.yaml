# Choques entre tareas (agent_lanes/choques.py: avisa con botones; agent_lanes/prevencion.py: frena al lanzar). Se relee en cada pasada: no hace
# falta reiniciar el runner. Lo que falte o no sea válido vale el default que se indica.
activo: true                  # false = apagado (no barre ni avisa)
minutos: 10                   # cada cuánto se barre
fuentes:
  tarjetas: true              # tarjetas activas de los tableros (con su rama lane/<id> si ya existe)
  ramas_lane: false           # 25-10 (Oscar): false. Había 171 ramas sin fusionar en oscar-hq (muchas de tarjetas cerradas) y >1.000 avisos en 2 días
  pr: false                   # 25-10 (Oscar): false; solo se avisa de choques entre tarjetas activas (decisiones reales)
  ramas_personas: false       # 25-10 (Oscar): false, mismo motivo; las ramas con PR abierto siguen entrando por «pr»
ramas_personas_dias: 14       # antigüedad máxima del último commit de una rama de persona
estados: [ready, todo, running, blocked]
nivel: modulo                 # archivo = solo si comparten un fichero; modulo = también si comparten carpeta
modulo_min_profundidad: 2
max_unidades: 40              # unidades (ramas/tarjetas) que se comparan por repo (más = se recorta, no se cae)
max_avisos: 6                 # avisos nuevos por pasada
comparten_max: 5              # rutas compartidas que se citan
recordar_dias: 30             # un par ya avisado no se vuelve a avisar hasta pasados N días
avisar_compatibles: false     # true = avisar también «misma zona, compatibles»; false = solo conflicto y revisar
# Aviso temprano: dos ramas (de carril o de persona) que ya tocan los MISMOS ficheros aunque git aún las fusione limpio,
# con alguna con PR abierto. Va primero la que tiene PR; el aviso pide [✅ Confirmar: PR #n primero, la otra espera].
temprano: true                # false = solo se avisa del conflicto ya hecho
temprano_ignorar: []          # ficheros que no cuentan (fnmatch, minúsculas), p. ej. ["*/changelog.md", "*.d.ts"]
fetch: true                   # git fetch --prune del remote antes de cada barrido (ve ramas nuevas sin esperar)
# Botones de todo aviso: 🙈 Ignorar este par (hasta recordar_dias), 🔇 Silenciar <rama> (lista editable en
# .state/choques_silenciadas.json) y 🔎 Ver PR. Entre dos tarjetas, además fusionar/encadenar/duplicada/pausar.
# Prevención al lanzar: una tarjeta ready que choca con otra del mismo repo en prevenir_estados, o con una rama lane/*
# sin fusionar, no se lanza en paralelo: queda en ready con un comentario CHOQUE-AL-LANZAR y se lanza sola cuando la
# otra termina, se fusiona o se cierra (o al pasar prevenir_max_horas). Respeta «Se complementan», Ignorar y Silenciar.
prevenir_al_lanzar: true      # false = no frena nada (solo avisos)
prevenir_nivel: archivo       # archivo = solo si comparten fichero; modulo = también carpeta (encolaría mucho más)
prevenir_estados: [running, review]
prevenir_ramas_lane: false    # 25-10 (Oscar): false; frena solo contra tarjetas running/review (prevenir_estados)
prevenir_max_horas: 24        # tope de espera por choque; después se lanza igualmente
prevenir_cache_minutos: 2     # caché de git/gh entre vueltas del planificador
# Contradicción de intención: si dos unidades de la misma zona casan un par (una dice A, la otra dice B) -> «revisar».
# Cada par son expresiones regulares sobre título+cuerpo, en minúsculas. Nunca se resuelve solo.
contradiccion:
  patrones:
    - [añad|agreg|crea|activ|habilit|introduc, quita|elimin|borra|desactiv|deshabilit|retira]
    - [renombr, borra|elimin]
    - [mueve|mover|trasl, deja en su sitio|no mover]
