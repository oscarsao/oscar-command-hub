# Carriles de agent-lanes. Contrato: oscar-command-hub/decisions/2026-09-27-arquitectura-carriles.md §5
# assignee del kanban de Hermes = nombre del carril. El dispatcher de Hermes ignora estos assignees
# (no son perfiles), así que solo los consume este runner.
# test_cmd: SOLO desde aquí, nunca del cuerpo de la tarea. Placeholders: {AGENT_LANES_DIR}, {BASE} (= remote/base).

runner:
  # Tope global de procesos claude vivos a la vez, sumando todos los carriles (review incluido).
  # 1 por defecto: hubo un OOM el 27-09 con varias sesiones abiertas.
  max_workers: 1
  interval_seconds: 60

# Avisos a Telegram. Destino de cada aviso de una tarea, por prioridad:
#   1. La línea `Origen-Telegram: chat=<id> thread=<id>` del cuerpo, si el chat está en TELEGRAM_ALLOWED_CHATS (.env)
#      y NO es un origen genérico (generic_origins, abajo): la tarea vuelve al tema donde se pidió.
#   2. El destino del carril (`telegram:` de cada carril): el tema de operaciones de su marca. Así las tareas creadas
#      desde el DM de Oscar, desde Gestión · General o sin origen aterrizan en el tema de su marca. El carril review
#      usa el destino del carril que revisa. Es config de confianza: no pasa por la allowlist.
#   3. TELEGRAM_CHAT_ID / TELEGRAM_THREAD_ID del .env (Gestión t5).
# Grupo Gestión -1003530490339: t5 Operaciones · General, t230 Operaciones · MigraTeam, t231 Operaciones · Píldora.
telegram:
  generic_origins:
    - {chat: 6744452215}              # DM de Oscar (cualquier hilo)
    - {chat: -1003530490339, thread: 5}  # Gestión · Operaciones General

defaults:
  max_resumes: 2
  heartbeat_seconds: 240
  # hermes 0.21.4: el heartbeat por CLI NO extiende claim_expires (solo last_heartbeat_at), así que el
  # lease se pide de una vez: claim --ttl = max_runtime + 300 s. El runner corta claude en max_runtime.
  max_runtime_seconds: 7200
  worktree_root: C:/Users/oscar/dev/_lanes
  remote: origin
  tool: claude
  model: sonnet
  effort: medium
  max_budget_usd: 3.0
  max_parallel: 1
  role: roles/implementador.md
  # En -p, acceptEdits solo aprueba ediciones; el resto de Bash se deniega salvo lo listado aquí.
  # Los pushes siguen pasando por contract/guard.py (solo lane/*).
  allowed_tools:
    - "Bash(git status:*)"
    - "Bash(git diff:*)"
    - "Bash(git log:*)"
    - "Bash(git show:*)"
    - "Bash(git branch:*)"
    - "Bash(git rev-parse:*)"
    - "Bash(git add:*)"
    - "Bash(git commit:*)"
    - "Bash(git push:*)"
    - "Bash(py -3.12 -m pytest:*)"
  forbidden_paths:
    - .github/workflows/

lanes:
  claude-oscarhq:
    telegram: {chat: -1003530490339, thread: 231}
    board: oscarhq
    repo: C:/Users/oscar/dev/oscar-hq
    base: master
    # pytest de oscar-hq no es usable como gate hoy (test_api_health falla en master por entorno; tarjeta aparte).
    test_cmd: py -3.12 "{AGENT_LANES_DIR}/agent_lanes/checks.py" {BASE}

  claude-migrateam:
    telegram: {chat: -1003530490339, thread: 230}
    board: migrateam
    repo: C:/Users/oscar/dev/migrateam
    # 28-09 (Oscar): en MigraTeam todo entra por develop (staging) y solo llega a master por promoción
    # release/<fecha> (CLAUDE.md del repo, tabla de ramas). Un carril NUNCA parte ni apunta a master.
    base: develop
    # AGENTS.md de MigraTeam: ownership por claims (.coordination/claims/, check_claims.py --diff falla si tocas
    # ficheros de otro dueño) y alembic/versions/ tiene un único propietario (integradora) => vetado aquí.
    # check_claims.py se ejecuta en su versión de {BASE}, nunca la copia del worker (sería ejecutar su código).
    test_cmd: py -3.12 "{AGENT_LANES_DIR}/agent_lanes/checks.py" {BASE} --run-from-base scripts/check_claims.py --diff {BASE}
    forbidden_paths:
      - .github/workflows/
      - backend/alembic/versions/

  claude-scraper:
    telegram: {chat: -1003530490339, thread: 231}
    board: oscarhq
    repo: C:/Users/oscar/dev/Scraper
    # Rama de trabajo activa (no main), confirmada con git el 27-09: origin/cambio/multiverse-benchmark-harness.
    base: cambio/multiverse-benchmark-harness
    test_cmd: py -3.12 "{AGENT_LANES_DIR}/agent_lanes/checks.py" {BASE}

  claude-nextjobs:
    telegram: {chat: -1003530490339, thread: 5}
    board: default
    repo: C:/Users/oscar/nextjobs/autoapply_v5
    base: master
    # Sin suite de tests versionada: gate = diff --check + compilación de los .py cambiados.
    test_cmd: py -3.12 "{AGENT_LANES_DIR}/agent_lanes/checks.py" {BASE}

  # Carril OPERATIVO (sin repo): vault/buzón del disco E:, calendario, accesos, ClickUp... Qué va aquí: README.md.
  # Carpeta de trabajo por tarea en worktree_root/<task_id> (no git). Hook: contract/ops_guard.py (lista blanca, fail
  # closed): sin borrar/mover, escritura solo en el workspace y en `Destino-Ops:` bajo dest_roots, MCP solo lectura.
  # Acciones externas/irreversibles -> needs_input con la acción exacta. Nunca done solo: siempre review para Oscar.
  # Todo lo heredable de defaults que es de código se sobrescribe aquí (allowed_tools, forbidden_paths, role...).
  claude-ops:
    kind: ops
    telegram: {chat: -1003530490339, thread: 5}
    board: oscarhq
    repo: ""
    base: ""
    test_cmd: ""
    role: roles/ops.md
    worktree_root: C:/Users/oscar/dev/_lanes/ops
    dest_roots: [C:/Users/oscar]
    max_parallel: 1
    max_budget_usd: 2.0
    max_runtime_seconds: 3600
    forbidden_paths: []
    # En -p lo no listado se deniega; el hook decide igualmente (una entrada aquí no salta el hook).
    allowed_tools:
      - "Bash(ls:*)"
      - "Bash(cat:*)"
      - "Bash(head:*)"
      - "Bash(tail:*)"
      - "Bash(wc:*)"
      - "Bash(du:*)"
      - "Bash(stat:*)"
      - "Bash(find:*)"
      - "Bash(grep:*)"
      - "Bash(sha256sum:*)"
      - "Bash(tree:*)"
      - "Bash(diff:*)"
      - "Bash(cp:*)"
      - "Bash(mkdir:*)"
      - "Bash(robocopy:*)"
      - "Bash(git status:*)"
      - "Bash(git log:*)"
      - "Bash(gh repo view:*)"
      - "Bash(gh repo list:*)"
      - "Bash(gh api:*)"
      - "Bash(cloudflared tunnel list:*)"
      - "Bash(cloudflared tunnel info:*)"
      - "mcp__claude_ai_Google_Calendar__list_calendars"
      - "mcp__claude_ai_Google_Calendar__list_events"
      - "mcp__claude_ai_Google_Calendar__get_event"
      - "mcp__claude_ai_Google_Calendar__search_events"
      - "mcp__claude_ai_Google_Drive__search_files"
      - "mcp__claude_ai_Google_Drive__read_file_content"
      - "mcp__claude_ai_Google_Drive__get_file_metadata"
      - "mcp__claude_ai_Google_Drive__get_file_permissions"
      - "mcp__claude_ai_Google_Drive__list_recent_files"
      - "mcp__claude_ai_ClickUp__clickup_get_task"
      - "mcp__claude_ai_ClickUp__clickup_filter_tasks"
      - "mcp__claude_ai_ClickUp__clickup_search"
      - "mcp__claude_ai_ClickUp__clickup_get_workspace_hierarchy"
      - "mcp__claude_ai_ClickUp__clickup_get_list"
      - "mcp__claude_ai_ClickUp__clickup_get_folder"
      - "mcp__claude_ai_ClickUp__clickup_get_task_comments"
      - "mcp__claude_ai_ClickUp__clickup_get_workspace_members"
      - "mcp__claude_ai_ClickUp__clickup_get_custom_fields"

  review:
    kind: review
    reviews: [claude-oscarhq, claude-migrateam, claude-scraper, claude-nextjobs]
    role: roles/revisor.md
    model: sonnet
    effort: medium
    max_budget_usd: 1.5
    max_runtime_seconds: 1800
    max_review_rounds: 2

# Carril Integrador (agent_lanes/integrator.py): fusión determinista de los PR aprobados por Oscar (APROBADO-OSCAR).
# Solo actúa con INTEGRATOR_ENABLED=true en agent-lanes/.env (por defecto apagado). Nunca fusiona sin el botón de
# Oscar, nunca --force/--admin, nunca push a la base, nunca migraciones ni variables de entorno.
# Prueba en seco: py -3.12 -m agent_lanes.integrator --dry-run [--lane claude-oscarhq --pr N]
# Carriles sin entrada aquí (scraper, nextjobs) no se integran; para añadirlos basta `deploy: none`.
integrator:
  interval_seconds: 300          # cada cuánto revisa tarjetas done aprobadas (el runner pasa cada 60 s)
  worktree_root: C:/Users/oscar/dev/_lanes/_integrator   # worktrees temporales int-<id> / intdep-<id>
  deploy_timeout_seconds: 900    # 15 min sondeando el deploy
  poll_seconds: 20
  lanes:
    claude-oscarhq:
      # Fusionar NO despliega: botón aparte [🚀 Desplegar] = `railway up --detach` de un worktree limpio del commit
      # fusionado (cwd = checkout enlazado con la CLI), ids explícitos, y sondeo de ESE deployment (no /api/health:
      # respondería el contenedor viejo). Ids leídos con `railway list --json` el 28-09 (no son secretos).
      deploy: railway_up
      manual_migrations: [supabase/migrations/]
      # Infraestructura de arranque/deploy: se puede fusionar, pero sin botón de deploy (lo revisa Oscar).
      sensitive_paths: [railway.json, railway.toml, nixpacks.toml, Procfile, Dockerfile, .railwayignore, requirements.txt, .github/]
      railway_dir: C:/Users/oscar/dev/oscar-hq
      railway_project: 34da294f-afdf-47f9-8ea9-5ffe3551e8f0      # Oscar HQ
      railway_service: 8dcda4bf-5a6f-49f5-aa75-b0b38f82e9ed      # Oscar HQ
      railway_environment: 3236716d-c75a-41fe-b426-9953deb7e426  # production
      health_url: https://oscar-hq-production.up.railway.app/api/health   # 2ª señal tras SUCCESS, nunca la única
    claude-migrateam:
      # 28-09: fusiona en develop, que DESPLIEGA STAGING solo (Railway staging + Vercel develop, alembic contra la BD
      # de staging). Nunca master: la promoción a producción es release/<fecha> con OK de Oscar, fuera del carril.
      # Con migración de Alembic no hay botón. Se verifica con GET /health de staging hasta que commit_sha sea el del merge.
      deploy: on_merge
      merge_label: "🔀 Fusionar en develop (despliega staging)"
      merge_warning: "⚠️ Fusionar despliega STAGING (develop), no producción; a master solo por release/<fecha>"
      alembic_versions: backend/alembic/versions/
      # alembic/env.py, alembic.ini, Procfile... corren en el arranque de Railway contra la BD de producción: sin botón.
      sensitive_paths: [backend/alembic/, backend/alembic.ini, backend/Procfile, backend/railway.json, backend/railway.toml, backend/nixpacks.toml, backend/Dockerfile, railway.json, vercel.json, frontend/vercel.json, .github/]
      health_url: https://migrateam-backend-staging-staging.up.railway.app/health
      health_commit_key: commit_sha
