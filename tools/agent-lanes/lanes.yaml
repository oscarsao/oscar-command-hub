# Carriles de agent-lanes. Contrato: oscar-command-hub/decisions/2026-09-27-arquitectura-carriles.md §5
# assignee del kanban de Hermes = nombre del carril. El dispatcher de Hermes ignora estos assignees
# (no son perfiles), así que solo los consume este runner.
# test_cmd: SOLO desde aquí, nunca del cuerpo de la tarea. Placeholders: {AGENT_LANES_DIR}, {BASE} (= remote/base).

runner:
  # Tope global de procesos claude vivos a la vez, sumando todos los carriles (review incluido).
  # Valor actual: 4 (el 21-oct Oscar lo subió de 2 a 3 para medir la RAM; el 4 es posterior, CF-11). ÚNICA fuente de verdad: el
  # servicio (install-service.ps1) no fija el número en su línea de comandos; `--max-workers N` en runner.py solo
  # sirve para pruebas puntuales y PISA este valor. Ojo con la RAM: hubo un OOM el 27-09 con varias sesiones abiertas
  # y el PC va justo (~0,9 GB libres el 21-oct). Si vuelve a haber OOM, bajar a 2 (o 1) aquí y reiniciar el runner.
  max_workers: 4
  # Huecos «grandes» (23-10, t_c5cafff2): tarjetas grandes (Tamaño L/XL, [GRANDE]/[WORKFLOW] o runtime estimado > big_minutes,
  # agent_lanes/grandes.py) corren en un hueco propio por carril (max_big, abajo) para no tapar lo pequeño del proyecto.
  # Este es el tope TOTAL de grandes a la vez; cuentan también contra max_workers (RAM). 0 = sin hueco grande.
  max_big_total: 2
  interval_seconds: 60
  # Vigilante de «runner ciego» (agent_lanes/ciego.py): si no se pueden listar tareas (p. ej. WinError 4551 de App
  # Control) durante estos minutos seguidos, aviso ALTA al DM de Oscar y un `restart --drain` automático (máx. 1/hora).
  ciego_minutes: 5
  # Llamadas a `hermes kanban`, `gh` y git remoto (t_cce5da81, 23-10): tiempo máximo por intento (s) y esperas entre
  # reintentos tras un timeout (solo lecturas e idempotentes; una escritura con timeout no se repite). Agotados, la
  # llamada devuelve un fallo (no tumba la pasada) y una decisión de Oscar afectada va a la cola de reintentos.
  cli_timeout_seconds: 120
  cli_timeout_backoff: [5, 20]

# Avisos a Telegram. Destino de cada aviso de una tarea, por prioridad:
#   1. La línea `Origen-Telegram: chat=<id> thread=<id>` del cuerpo, si el chat está en TELEGRAM_ALLOWED_CHATS (.env)
#      y NO es un origen genérico (generic_origins, abajo): la tarea vuelve al tema donde se pidió.
#   2. El destino del carril (`telegram:` de cada carril): el tema de operaciones de su marca. Así las tareas creadas
#      desde el DM de Oscar, desde Gestión · General o sin origen aterrizan en el tema de su marca. El carril review
#      usa el destino del carril que revisa. Es config de confianza: no pasa por la allowlist.
#   3. TELEGRAM_CHAT_ID / TELEGRAM_THREAD_ID del .env (Gestión t5).
# Grupo Gestión -1003530490339: t5 Operaciones · General, t230 Operaciones · MigraTeam, t231 Operaciones · Píldora.
telegram:
  # Los user_id del equipo (tools/telegram/people.yaml) NO van aquí: su DM no es un origen genérico y debe volver a
  # su chat. Allowlist DERIVADA (F1-02): TELEGRAM_ALLOWED_CHATS del .env + los user_id de people.yaml (sin null ni
  # suspendidos) + los chats que este fichero ya usa como destino (temas de carril, final_only, Integración,
  # 🎯 Decisiones, panel del hub, 👥 Equipo). Ya no hace falta repetirlos a mano en el .env (telegram.allowlist).
  generic_origins:
    - {chat: 6744452215}              # DM de Oscar (cualquier hilo)
    - {chat: -1003530490339, thread: 5}  # Gestión · Operaciones General
  # «Solo resultado final» (22-oct, grupo de desarrollo de Angel): en estos chats un aviso de proceso (needs_input,
  # blocked, stuck, changes) NO se publica; llega al DM de Oscar con sus botones. Quedan inicio (▶️), review y done.
  # thread omitido = cualquier hilo. Quitar el bloque restaura el comportamiento de siempre.
  final_only:
    - {chat: -1003731090094}          # Grupo de desarrollo de Angel
  # Aviso al equipo (APAGADO por defecto: sin esta clave, o con enabled: false, el bot ignora el texto de los grupos).
  # Con enabled: true, si alguien escribe a ESTE bot en uno de los chats (@mención o respuesta a un mensaje suyo)
  # contesta una vez por minuto «esto lo lleva el asistente del equipo». Lo que hablan entre ellos no se contesta.
  # 25-10 (Oscar, «sí, activa el aviso»): Andrea e Ingerber están sin Hermes (hermes: false, 24-10) y no recibían respuesta.
  # Segundo disparo (t_62bc2a5f): quien en tools/telegram/people.yaml tiene `hermes: false` (Hermes lo bloquea en
  # silencio) y escribe a Hermes recibe este mismo aviso, UNA vez por persona y día (y con el enfriamiento del chat).
  # «Escribe a Hermes» = @mención de `hermes_username`, respuesta a un mensaje de ese bot, o texto libre en un tema de
  # `hermes_topics` (los free_response_topics de Hermes, donde contesta sin mención: «chat:tema»). Quien tiene Hermes
  # (Oscar, María, Ángel) y las charlas entre personas sin mención a un bot no reciben nada.
  team_notice:
    enabled: true
    chats: [-1004277259008]   # Marketing
    text: "Hermes (@oscarsaoBot) todavía no está disponible para el equipo: llegará con el asistente de equipo. Mientras, aquí os atiende Trabajos (/ayuda@pildora_carriles_bot) y lo demás se lo pedís a Oscar."
  # Opcionales de t_62bc2a5f (bajo team_notice): hermes_username: oscarsaoBot  y  hermes_topics: ["-100XXXXXXXXXX:406"]
  # (temas con respuesta libre de Hermes, p. ej. Marketing t406). Sin ellos solo cuentan @mención y respuesta al bot.
  # Texto libre de Oscar = respuesta a la decisión pendiente de ESE tema (auditoría t_dddcc232, P1), SOLO si el mensaje
  # es una respuesta (reply_to) a un mensaje de este bot (24-10: Trabajos = motor silencioso; la conversación es de Hermes). Con una sola
  # pendiente la toma como respuesta (eco + Deshacer); con varias pregunta cuál. Nunca promueve/fusiona/despliega.
  # window_hours: solo cuentan avisos enviados en las últimas N horas. max_choices: botones del selector.
  # Quitar el bloque apaga la función.
  free_text: {window_hours: 72, max_choices: 5}
  # Tema «🎯 Decisiones» (25-10, Oscar): lo que necesita decisión (de Oscar, María o Ángel) va AL MOMENTO y con botones
  # a este tema; al DM de Oscar solo una línea con enlace. Al decidir, el mensaje pasa a «✅ <acción> por <persona>» y
  # un mensaje fijado del tema lleva «N decisiones pendientes» (agent_lanes/canal_avisos.py). Hacen falta chat Y thread
  # (thread != 0); sin la clave todo sigue yendo al DM como antes. El integrador pondrá el id del tema al crearlo:
  destinos:   # 25-10 (Oscar, botón): tema 🎯 Decisiones creado por el integrador en Gestión
    decisiones: {chat: -1003530490339, thread: 2053}

# API de Oscar HQ (F1-02, CF-03): URL por defecto de sync_usuarios y de la vigilancia del 👥 Equipo. OHQ_API_URL del
# .env manda sobre esta; la CLAVE (OHQ_API_KEY) solo va en el .env y no tiene valor por defecto (sin ella, apagados).
ohq: {api_url: https://api.pildoradigital.com}

# Tema de Integración (28-09, Oscar): TODO aviso de PR/merge/deploy (tarjeta done con ✅ Aprobar, "Listo para integrar",
# gates fallidos, en espera, fusionado, desplegado, fallo de deploy) va aquí como ficha con cabecera por riesgo
# (🟢 staging · 🟠 deploy manual · 🔴 producción · ⏸ en espera · ⛔ gates fallidos) y, como copia espejo sincronizada,
# al DM de Oscar. En el tema del carril solo queda una línea con enlace. El runner mantiene aquí un mensaje FIJADO con lo
# pendiente de integrar (lo edita en cada pasada del integrador; message_id en .state/integrator/pinned.json).
# Sin esta clave, los avisos siguen en el tema del carril con el formato de siempre.
integration_telegram: {chat: -1003530490339, thread: 398}   # Gestión · 🚦 Integración y despliegues

# Vigilante del equipo (t_04fe996e): solicitudes del equipo (fichas con botones) y fallos de los bots, en Gestión.
# El bot intenta UNA vez crear el tema «👥 Equipo» (createForumTopic, necesita el permiso «gestionar temas»); si no
# puede, usa `thread` (t5 Operaciones General). El id creado se guarda en .state/vigilancia.json. Horas y topes por
# hora: /ajustes (equipo.horas, equipo.urgentes_hora, equipo.fichas_hora). `carriles`: proyecto -> carril de «Aprobar».
equipo_telegram: {chat: -1003530490339, thread: 5, crear_tema: true, nombre: "👥 Equipo"}

# Mensaje vivo del fijado (22-10, Oscar): el mismo mensaje fijado de arriba pasa a mostrar también 🔧 en marcha,
# ⏳ siguientes en cola, ✅ terminadas y ⚠️ conflictos vigentes con botones [🛠 Resolver] [👁 Ver] [⏸ Aparcar].
# Con enabled: true dejan de mandarse los avisos sueltos de «PR esperando» (PR en conflicto): viven en el panel.
# enabled: false (o quitar el bloque) = el fijado queda solo con «pendiente de integrar», como antes.
live_panel: {enabled: true, queue: 3, done: 5, done_hours: 24, conflicts: 6}

# Panel de carriles y workflows (H3 «Telegram como consola del integrador», 24-10): UN mensaje fijado en
# Desarrollo Píldora › Hub y carriles que se edita en su sitio (estado en .state/hub_panel.json). Lee el kanban como
# mucho cada `min_seconds`. Fijarlo necesita que el bot sea admin del grupo con «fijar mensajes».
hub_panel: {enabled: true, chat: -1003731090094, thread: 38, min_seconds: 180}

# Topes de los avisos de Telegram (los de fábrica están en notices.LIMITS). Nada se recorta en silencio: lo que no cabe
# se marca ("➕ +2 preguntas más", "[…recortado]") y el resto va en un segundo mensaje o en la tarjeta.
notices:
  questions_max_items: 5     # preguntas por aviso
  questions_max_chars: 1200  # bloque de preguntas completo
  question_max_chars: 280    # cada pregunta
  option_max_chars: 40       # cada opción (A/B/C/D)
  reason_max: 1500           # motivo del bloqueo en la tarjeta (hermes block)
  text_max: 4000             # mensaje de Telegram (admite 4096): se parte por aquí

defaults:
  max_resumes: 2
  heartbeat_seconds: 240
  # hermes 0.21.4: el heartbeat por CLI NO extiende claim_expires (solo last_heartbeat_at), así que el
  # lease se pide de una vez: claim --ttl = max_runtime + 300 s. El runner corta claude en max_runtime.
  max_runtime_seconds: 7200
  worktree_root: C:/Users/oscar/dev/_lanes
  remote: origin
  tool: claude
  model: sonnet
  effort: medium
  max_budget_usd: 3.0
  # Por carril, no global. Se queda en 1: cada carril trabaja un repo y dos workers en el mismo repo/checkout podrían
  # pisarse (worktrees, migraciones, pushes). El paralelismo sale de carriles DISTINTOS (repos distintos) o de un
  # carril + review. No subirlo sin mirar el riesgo de ese repo (hoy: claude-oscarhq y claude-hub en 2, el resto en 1).
  max_parallel: 1
  # Hueco grande por carril (máx. grandes a la vez en un proyecto; fuera de max_parallel) y umbral de runtime estimado.
  max_big: 1
  big_minutes: 45
  role: roles/implementador.md
  # En -p, acceptEdits solo aprueba ediciones; el resto de Bash se deniega salvo lo listado aquí.
  # Los pushes siguen pasando por contract/guard.py (solo lane/*).
  allowed_tools:
    - "Bash(git status:*)"
    - "Bash(git diff:*)"
    - "Bash(git log:*)"
    - "Bash(git show:*)"
    - "Bash(git branch:*)"
    - "Bash(git rev-parse:*)"
    # 30-09 (OK de Oscar): traer origin/<base> o la rama nombrada en la tarea a lane/<id>. guard.py solo deja
    # `git merge origin/...` (y --abort/--continue); nunca merge de una rama local ni hacia master/develop.
    - "Bash(git fetch:*)"
    - "Bash(git merge:*)"
    - "Bash(git add:*)"
    - "Bash(git commit:*)"
    - "Bash(git push:*)"
    - "Bash(py -3.12 -m pytest:*)"
    # 24-10 (OK de Oscar, botón «lista de permisos para los carriles»): construir y probar sin pedir aprobación
    # (t_b28a1ed7, t_77bcf9b0 y t_04db0d4e se pararon en npm ci / tsc / node). Solo instalar, compilar, lint y tests;
    # despliegues, alembic contra BD remota y merges siguen vetados por contract/guard.py.
    - "Bash(npm ci:*)"
    # F1-07 (S-06): fuera `npm install:*` (aprobaba `npm install <paquete>` sin preguntar); el guard veta añadir paquetes.
    - "Bash(npm run:*)"
    - "Bash(npm test:*)"
    - "Bash(pnpm install:*)"
    - "Bash(pnpm run:*)"
    - "Bash(pnpm test:*)"
    - "Bash(pnpm exec tsc:*)"
    - "Bash(pnpm exec vitest:*)"
    # 25-10 (OK de Oscar): Oscar HQ usa pnpm; los workers lo pedían como `npx pnpm@10 install --frozen-lockfile` (t_b14317c3,
    # t_78b8b58d) y no coincidía con ninguna regla. Solo instalar con lockfile, tsc, vitest y lint; `pnpm add`, `-g` y
    # `dlx` los deniegan contract/worker-settings.json y contract/guard.py.
    - "Bash(npx pnpm@10 install:*)"
    - "Bash(npx pnpm@10 exec:*)"
    - "Bash(npx pnpm@10 run:*)"
    - "Bash(npx pnpm@10 lint:*)"
    - "Bash(npx -y pnpm@10 install:*)"
    - "Bash(npx -y pnpm@10 exec:*)"
    - "Bash(corepack pnpm@10.18.3 install:*)"
    - "Bash(corepack pnpm@10.18.3 exec:*)"
    - "Bash(corepack pnpm@10.18.3 run:*)"
    - "Bash(pnpm lint:*)"
    - "Bash(pnpm exec next lint:*)"
    - "Bash(npx next lint:*)"
    - "Bash(cd dashboard:*)"
    - "Bash(cd frontend:*)"
    - "Bash(npx tsc:*)"
    - "Bash(npx vitest:*)"
    - "Bash(npx eslint:*)"
    - "Bash(npx next build:*)"
    - "Bash(node node_modules/:*)"
    - "Bash(node ./node_modules/:*)"
    - "Bash(py -3.12 -m ruff:*)"
    - "Bash(py -3.12 -m mypy:*)"
    - "Bash(py -3.12 -m pip install -r:*)"
    - "Bash(ruff:*)"
    - "Bash(gh pr create:*)"
    - "Bash(gh pr view:*)"
    - "Bash(gh pr list:*)"
    # 22-10 (OK de Oscar): skills de usuario que los workers pueden invocar en -p (skills/README.md del hub).
    - "Skill(integrar-lote)"
    - "Skill(tarjeta-carril)"
  forbidden_paths:
    - .github/workflows/

lanes:
  claude-oscarhq:
    telegram: {chat: -1003731090094, thread: 29}  # Desarrollo Píldora (Oscar 23-10: lo de Píldora, Signal y Hub va al grupo de Ángel)
    board: oscarhq
    repo: C:/Users/oscar/dev/oscar-hq
    # Candado (28-09): el runner solo reclama si `git remote get-url origin` del repo es este owner/repo de GitHub.
    github: oscarsao/oscar-hq
    base: master
    # 23-10 (Oscar): 2 plazas para Oscar HQ, cada una en su worktree lane/<id>. Dos tarjetas que citan supabase/migrations
    # no corren a la vez (serialize_paths); el resto sí. La tarjeta grande va aparte (max_big), sin gastar estas dos.
    max_parallel: 2
    serialize_paths: [supabase/migrations]
    # pytest de oscar-hq no es usable como gate hoy (test_api_health falla en master por entorno; tarjeta aparte).
    test_cmd: py -3.12 "{AGENT_LANES_DIR}/agent_lanes/checks.py" {BASE}

  claude-migrateam:
    telegram: {chat: -1003530490339, thread: 230}
    board: migrateam
    repo: C:/Users/oscar/dev/migrateam
    github: PildoraDigital/OCR-PDF-and-images
    # 28-09 (Oscar): en MigraTeam todo entra por develop (staging) y solo llega a master por promoción
    # release/<fecha> (CLAUDE.md del repo, tabla de ramas). Un carril NUNCA parte ni apunta a master.
    base: develop
    # AGENTS.md de MigraTeam: ownership por claims (.coordination/claims/, check_claims.py --diff falla si tocas
    # ficheros de otro dueño) y alembic/versions/ tiene un único propietario (integradora) => vetado aquí.
    # check_claims.py se ejecuta en su versión de {BASE}, nunca la copia del worker (sería ejecutar su código).
    test_cmd: py -3.12 "{AGENT_LANES_DIR}/agent_lanes/checks.py" {BASE} --run-from-base scripts/check_claims.py --diff {BASE}
    forbidden_paths:
      - .github/workflows/
      - backend/alembic/versions/

  claude-scraper:
    telegram: {chat: -1003731090094, thread: 36}  # Desarrollo Píldora (Oscar 23-10: lo de Píldora, Signal y Hub va al grupo de Ángel)
    board: oscarhq
    repo: C:/Users/oscar/dev/Scraper
    github: oscarsao/icp-prospect-engine
    # Rama de trabajo activa (no main), confirmada con git el 27-09: origin/cambio/multiverse-benchmark-harness.
    base: cambio/multiverse-benchmark-harness
    test_cmd: py -3.12 "{AGENT_LANES_DIR}/agent_lanes/checks.py" {BASE}

  claude-nextjobs:
    telegram: {chat: -1003530490339, thread: 5}
    board: default
    repo: C:/Users/oscar/nextjobs/autoapply_v5
    github: oscarsao/nextjobs-autoapply
    base: master
    # Sin suite de tests versionada: gate = diff --check + compilación de los .py cambiados.
    test_cmd: py -3.12 "{AGENT_LANES_DIR}/agent_lanes/checks.py" {BASE}

  # Carril del PROPIO sistema (28-09, plan D): arreglos de agent-lanes/monitor/telegram pedidos desde Telegram, sin
  # sesión de Claude Code. Es el código que ejecuta a los workers: rol propio (cambios mínimos, tests obligatorios,
  # hooks de seguridad solo avisando en for_oscar). El hook que se aplica al worker es el del checkout VIVO
  # (render_settings usa el ROOT del runner), no su copia del worktree: un cambio en contract/ no rige hasta fusionar
  # y aplicar. test_cmd: el mismo gate genérico + la suite de agent-lanes del worktree (pytest encuentra
  # tools/agent-lanes/pytest.ini desde la ruta de tests: pythonpath = la copia del worker, nunca el checkout vivo).
  # OJO: la suite es código del worker y se ejecuta como Oscar (verify.py sin entorno mínimo; el integrador sí).
  claude-hub:
    telegram: {chat: -1003731090094, thread: 38}  # Desarrollo Píldora (Oscar 23-10: lo de Píldora, Signal y Hub va al grupo de Ángel)
    board: default
    repo: C:/Users/oscar/oscar-command-hub
    github: oscarsao/oscar-command-hub
    base: main
    role: roles/hub.md
    model: sonnet
    max_budget_usd: 3.0
    test_cmd: py -3.12 "{AGENT_LANES_DIR}/agent_lanes/checks.py" {BASE} && py -3.12 -m pytest tools/agent-lanes/tests -q
    # La lista sustituye a la de defaults (no se fusiona): .github/workflows/ se repite a propósito.
    max_parallel: 2  # 21-10: Oscar quiere las entregas A/B/C del pitch de seguimiento a la vez
    forbidden_paths:
      - .github/workflows/
      - tools/agent-lanes/.env
      - tools/agent-lanes/.state/
      - tools/monitor/.state/
      - tools/telegram/.state/
    # 23-10 (carriles por proyecto, entrega A): «Hub y Telegram» es UN carril. `claude-telegram` queda como alias (las
    # tarjetas abiertas y el .env no se rompen; nunca se emite). reserved_slots: plaza FUERA de max_workers (aunque los
    # generales estén llenos siempre puede tener este número de workers propios; antes la tenía claude-telegram).
    # Trabaja en DOS repos; la tarjeta elige con una línea `Repo: hub|oscar-hq` en el cuerpo (lista blanca `repos:`; sin
    # línea se deduce de las rutas de los bots que cite y, si no, el primero = hub). El título `[Telegram]` o citar los
    # bots lo enruta aquí (clasificador.yaml, `telegram:`). Cada entrada de repos puede sobrescribir repo, github, base,
    # test_cmd, role, forbidden_paths y remote. Mismos límites que un carril de código: hook contract/guard.py, rama lane/<id>.
    aliases: [claude-telegram]
    reserved_slots: 1
    repos:
      hub:
        repo: C:/Users/oscar/oscar-command-hub
        github: oscarsao/oscar-command-hub
        base: main
        role: roles/hub.md
        test_cmd: py -3.12 "{AGENT_LANES_DIR}/agent_lanes/checks.py" {BASE} && py -3.12 -m pytest tools/agent-lanes/tests -q
        forbidden_paths:
          - .github/workflows/
          - tools/agent-lanes/.env
          - tools/agent-lanes/.state/
          - tools/monitor/.state/
          - tools/telegram/.state/
      oscar-hq:
        repo: C:/Users/oscar/dev/oscar-hq
        github: oscarsao/oscar-hq
        base: master
        role: roles/implementador.md
        test_cmd: py -3.12 "{AGENT_LANES_DIR}/agent_lanes/checks.py" {BASE}
        forbidden_paths:
          - .github/workflows/

  # Carril OPERATIVO (sin repo): vault/buzón del disco E:, calendario, accesos, ClickUp... Qué va aquí: README.md.
  # Carpeta de trabajo por tarea en worktree_root/<task_id> (no git). Hook: contract/ops_guard.py (lista blanca, fail
  # closed): sin borrar/mover, escritura solo en el workspace y en `Destino-Ops:` bajo dest_roots, MCP solo lectura.
  # Acciones externas/irreversibles -> needs_input con la acción exacta. Nunca done solo: siempre review para Oscar.
  # Todo lo heredable de defaults que es de código se sobrescribe aquí (allowed_tools, forbidden_paths, role...).
  claude-ops:
    kind: ops
    telegram: {chat: -1003530490339, thread: 5}
    board: oscarhq
    repo: ""
    base: ""
    test_cmd: ""
    role: roles/ops.md
    worktree_root: C:/Users/oscar/dev/_lanes/ops
    # 30-09: + carpeta legal de la LLC en E: (destino que pidió Oscar para t_0d94921e; solo esa carpeta).
    dest_roots: [C:/Users/oscar, "E:/02_Negocio_Pildora/LEGAL-LLC"]
    max_parallel: 1
    max_budget_usd: 2.0
    max_runtime_seconds: 3600
    forbidden_paths: []
    # En -p lo no listado se deniega; el hook decide igualmente (una entrada aquí no salta el hook).
    allowed_tools:
      - "Bash(ls:*)"
      - "Bash(cat:*)"
      - "Bash(head:*)"
      - "Bash(tail:*)"
      - "Bash(wc:*)"
      - "Bash(du:*)"
      - "Bash(stat:*)"
      - "Bash(find:*)"
      - "Bash(grep:*)"
      - "Bash(sha256sum:*)"
      - "Bash(tree:*)"
      - "Bash(diff:*)"
      - "Bash(cp:*)"
      - "Bash(mkdir:*)"
      - "Bash(robocopy:*)"
      - "Bash(git status:*)"
      - "Bash(git log:*)"
      - "Bash(gh repo view:*)"
      - "Bash(gh repo list:*)"
      - "Bash(gh api:*)"
      - "Bash(cloudflared tunnel list:*)"
      - "Bash(cloudflared tunnel info:*)"
