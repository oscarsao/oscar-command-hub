# Carril Integrador (agent_lanes/integrator.py): fusión determinista de los PR aprobados por Oscar (APROBADO-OSCAR).
# Solo actúa con INTEGRATOR_ENABLED=true en agent-lanes/.env (por defecto apagado). Nunca fusiona sin el botón de
# Oscar, nunca --force/--admin, nunca push a la base, nunca migraciones ni variables de entorno.
# Prueba en seco: py -3.12 -m agent_lanes.integrator --dry-run [--lane claude-oscarhq --pr N]
# Promoción a producción desde Telegram (agent_lanes/promote.py): /promover migrateam o [🚀 Promover a producción] en
# 🚦. PR develop → master, checks obligatorios, alembic_version de producción por /health (solo lectura) y doble
# confirmación. Si el /health de producción no expone alembic_version no hay botón (cambio en el repo MigraTeam).
promote:
  migrateam:
    repo: PildoraDigital/OCR-PDF-and-images
    head: develop
    base: master
    health_url: https://api.migrateam.com/health
    health_commit_key: commit_sha
    health_alembic_key: alembic_version
    alembic_versions: backend/alembic/versions/
    seeds: [backend/seeds/, backend/app/seeds/]
    sensitive_paths: [backend/alembic/, backend/alembic.ini, backend/Procfile, backend/railway.json, backend/railway.toml, backend/nixpacks.toml, backend/Dockerfile, railway.json, vercel.json, frontend/vercel.json, .github/]

# Avisos de producción del monitor (tools/monitor/prodwatch.py): fallo de un despliegue de PRODUCCIÓN en Vercel (las
# vistas previas de lane/* no avisan; un aviso por despliegue) y salud del servidor (health_url de cada carril de
# `integrator.lanes` + estado de su aplicación en Dokploy). Tokens por NOMBRE de variable (agent-lanes/.env), no aquí.
# projects: nombres o ids (prj_…) de los proyectos de Vercel; team_id solo si están en un equipo.
monitor_alerts:
  vercel:
    token_env: VERCEL_TOKEN
    team_id: ""
    projects: [recursos, website]
  skip_health: []   # carriles cuyo staging se excluye del monitor de salud (claude-migrateam retirado el 23-10: staging sano)

# Carriles sin entrada aquí (nextjobs) no se integran; para añadirlos basta `deploy: none`.
integrator:
  interval_seconds: 300          # cada cuánto revisa tarjetas done aprobadas (el runner pasa cada 60 s)
  worktree_root: C:/Users/oscar/dev/_lanes/_integrator   # worktrees temporales int-<id> / intdep-<id>
  deploy_timeout_seconds: 900    # 15 min sondeando el deploy
  poll_seconds: 20
  # Autor de los commits de fusión de lote/conflictos. Vercel bloquea los despliegues de commits cuyo autor no es del
  # equipo (agent-lanes@localhost dejó `recursos` en BLOCKED, 22-10): el noreply de GitHub de Oscar sí lo es.
  commit_author: {name: oscarsao, email: oscarsao@users.noreply.github.com}
  lanes:
    claude-oscarhq:
      # Fusionar NO despliega: botón aparte [🚀 Desplegar]. Desde el 22-10 Oscar HQ corre en pildora-01 (Hetzner) con
      # Dokploy (Railway ya no): application.deploy (no redeploy), sondeo de application.one hasta done/error y GET health_url.
      # dokploy_url: hoy el túnel SSH al panel (http://localhost:3300); con Cloudflare Access será https://panel.pildoradigital.com.
      # dokploy_application_id: pégalo desde el panel (aplicación oscar-hq → URL/ajustes). Vacío = el 🚀 avisa «deploy no
      # configurado». El TOKEN no va aquí: dokploy_token_env es el NOMBRE de la variable (en agent-lanes/.env).
      # Para volver a Railway: deploy: railway_up + railway_dir/project/service/environment (ids en el historial de git).
      deploy: dokploy
      dokploy_url: http://localhost:3300
      dokploy_application_id: ""
      dokploy_token_env: DOKPLOY_API_TOKEN
      risk: manual                  # 🟠 cabecera de la ficha: deploy manual con botón
      risk_label: OSCAR HQ
      batch: daily                  # lote diario (agent_lanes/batch.py): un solo botón [🔀 Fusionar lote] a las 08:30 o con /lote oscarhq
      manual_migrations: [supabase/migrations/]
      # Mismo gate que el build de Vercel (#172 dijo «tests OK» con el dashboard roto): tsc + vitest en un worktree limpio.
      # El dashboard usa pnpm (pnpm-lock.yaml, sin package-lock.json): con `npm ci` el gate fallaba SIEMPRE en ~2 s
      # (EUSAGE) y el lote echaba como «rompe el build» a toda rama que tocara dashboard/ (lote del 22-10).
      # pnpm no está en PATH: va por corepack, versión fijada; safe_env() no hereda COREPACK_*, de ahí el `set`.
      batch_frontend_paths: [dashboard/]
      batch_frontend_cmd: cd dashboard && set COREPACK_ENABLE_DOWNLOAD_PROMPT=0&& corepack pnpm@10.18.3 install --frozen-lockfile && npx tsc --noEmit && npx vitest run
      # Infraestructura de arranque/deploy: se puede fusionar, pero sin botón de deploy (lo revisa Oscar).
      sensitive_paths: [railway.json, railway.toml, nixpacks.toml, Procfile, Dockerfile, .railwayignore, requirements.txt, .github/]
      health_url: https://api.pildoradigital.com/api/health   # se verifica tras el done de Dokploy
    claude-migrateam:
      # 28-09: fusiona en develop, que DESPLIEGA STAGING solo (Railway staging + Vercel develop, alembic contra la BD
      # de staging). Nunca master: la promoción a producción es release/<fecha> con OK de Oscar, fuera del carril.
      # Con migración de Alembic no hay botón. Se verifica con GET /health de staging hasta que commit_sha sea el del merge.
      deploy: on_merge
      risk: staging                 # 🟢 develop = staging. Un on_merge sin `risk` se trata como 🔴 PRODUCCIÓN.
      batch: daily                  # lote diario: un solo botón [🔀 Fusionar lote] a las 08:30 o con /lote migrateam
      merge_label: "🔀 Fusionar en develop (despliega staging)"
      merge_warning: "⚠️ Fusionar despliega STAGING (develop), no producción; a master solo por release/<fecha>"
      alembic_versions: backend/alembic/versions/
      # alembic/env.py, alembic.ini, Procfile... corren en el arranque de Railway contra la BD de producción: sin botón.
      sensitive_paths: [backend/alembic/, backend/alembic.ini, backend/Procfile, backend/railway.json, backend/railway.toml, backend/nixpacks.toml, backend/Dockerfile, railway.json, vercel.json, frontend/vercel.json, .github/]
      health_url: https://migrateam-backend-staging-staging.up.railway.app/health
      health_commit_key: commit_sha
    claude-hub:
      # 28-09 (plan D): el propio sistema. Fusionar en main NO despliega nada (deploy none). Tras fusionar, botón
      # [🔁 Aplicar (reinicio ordenado)] = `py -3.12 lanes.py restart --drain` en el checkout vivo (apply:
      # restart_drain). El subcomando lo aporta feat/plan-d-runtime: hasta que exista en lanes.py el botón no sale.
      # El avance del checkout raíz a main (fast-forward) es parte de ese restart/deploy de HEAD, nunca del integrador.
      # Activo: claude-hub ya está en INTEGRATOR_LANES de agent-lanes/.env (comprobado en la auditoría del 25-10).
      deploy: none
      apply: restart_drain
      risk: system                  # ⚙️ cabecera de la ficha: cambia el código que ejecuta a los workers
      risk_label: SISTEMA
      # Hooks y contrato de seguridad de los workers: se puede fusionar, con aviso en la ficha (revísalo tú).
      sensitive_paths: [tools/agent-lanes/contract/, tools/agent-lanes/lanes.yaml]
    claude-scraper:
      # 01-10: Railway despliega el Scraper desde la rama base: fusionar = producción. Se verifica con GitHub
      # Deployments del commit fusionado (success), no con /health.
      # Activo: claude-scraper ya está en INTEGRATOR_LANES de agent-lanes/.env (auditoría del 25-10). Ojo, CF-07 sin
      # resolver: Railway sigue desplegando el Scraper y pildora-01 también lo ejecuta; un solo entorno lo decide Oscar.
      deploy: on_merge
      deploy_check: github_deployments
      risk: production              # 🔴 PRODUCCIÓN
      risk_label: SCRAPER
      merge_warning: "⚠️ Fusionar DESPLIEGA el Scraper a producción solo (Railway, desde la rama base)"
      sensitive_paths: [railway.json, railway.toml, nixpacks.toml, Procfile, Dockerfile, requirements.txt, .github/]
