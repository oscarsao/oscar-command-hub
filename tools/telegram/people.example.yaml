# EJEMPLO de people.yaml con ids FICTICIOS. El fichero real (con los ids de Telegram de verdad) NO se versiona: el repo
# es público. Cópialo a tools/agent-lanes/.state/people.yaml (ruta por defecto, ignorada por git) o apunta a otra con
# la variable de entorno AGENT_LANES_PEOPLE_FILE, y rellena los user_id reales allí.
#
# Personas del equipo que pueden escribir por DM al bot de carriles (@pildora_carriles_bot). Aquí van SOLO las
# IDENTIDADES: user_id de Telegram, nombre, rol y si Hermes les contesta.
# Tras editar el fichero real:
#   py -3.12 tools/telegram/sincronizar_permisos.py --apply   (allowed users del .env y tabla de SOUL.md de Hermes)
#   hermes gateway restart
# Hermes solo contesta a Oscar y a quien tenga user_id aqui; sin user_id (null) no se le contesta.
# Lo lee agent_lanes/people.py.
#
# QUIEN APRUEBA, INTEGRA Y DESPLIEGA ya NO se configura aqui (decision de Oscar 28-10): se configura en el panel de
# Oscar HQ (permisos de desarrollo por persona y marca) y el hub lo lee de GET /api/equipo/permisos (cache de 60 s):
#   - desarrollo.aprobar de una marca = operar (comandos, botones, aprobaciones) en esa marca.
#   - desarrollo.publicar de una marca = fusionar a main/master, desplegar, migrar y variables de entorno.
# Si Oscar HQ no responde o la persona no esta enlazada alli, SOLO actua Oscar (falla cerrado). Las claves
# `operador`, `permisos` y `brands` de este fichero ya no se leen.
#
# Reglas (las aplica el codigo, no este fichero):
#   - Oscar (owner) NO se declara aqui: su id es OWNER_TELEGRAM_ID (agent_lanes/decisions.py). Una entrada con
#     role: owner se ignora.
#   - Una entrada sin user_id (null) se IGNORA: la persona recibe el rechazo de "no conocida" hasta que se rellene.
#   - Capacidades por rol (fijas en codigo): coo/cmo/marketing/dev = consulta, estado, idea, contenido.
#     `can` solo admite `carril` y solo para coo; hoy esta RESERVADO: aunque se active, todo DM de un no-owner
#     sigue creando una tarjeta [IDEA] asignada a oscar, nunca una tarea de carril ejecutable.
#   - Tras rellenar un user_id (Oscar, a mano): anadirlo a TELEGRAM_ALLOWED_CHATS en tools/agent-lanes/.env para que
#     los avisos vuelvan a su DM, y que la persona envie /start al bot. NO anadirlo a generic_origins de lanes.yaml.
people:
  maria:
    name: María
    user_id: "5000000001"   # María (socia/estrategia)
    role: coo
    can: []         # [carril] reservado; desactivado por defecto
  ingerber:
    name: Ingerber
    user_id: "5000000002"   # Ingerber (CMO Pildora)
    hermes: false   # 24-10 (Oscar): sin Hermes hasta tener un Hermes de equipo sin terminal ni ficheros
    role: cmo
    can: []
  andrea:
    name: Andrea
    user_id: "5000000003"   # Andrea (marketing, a prueba)
    hermes: false   # 24-10 (Oscar): sin Hermes hasta tener un Hermes de equipo sin terminal ni ficheros
    role: marketing
    can: []
  mauredy:
    name: Mauredy
    user_id: null   # PENDIENTE - rellenar cuando Oscar confirme el Telegram ID (atencion cliente + desarrollo MigraTeam)
    role: dev
    can: []
  angel:
    name: Angel
    user_id: "5000000004"   # Angel (CTO OscarHQ + Signal)
    role: dev
    can: []
