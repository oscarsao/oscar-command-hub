# Personas del equipo que pueden escribir por DM al bot de carriles (@pildora_carriles_bot).
# Decisiones de roles y permisos (D4-D10, 25-10): decisions/2026-10-25-personas-roles-permisos.md
# UNA SOLA FUENTE de permisos (24-10, Oscar): tambien manda en Hermes (@oscarsaoBot). Tras editar este fichero:
#   py -3.12 tools/telegram/sincronizar_permisos.py --apply   (allowed users del .env y tabla de SOUL.md de Hermes)
#   hermes gateway restart
# Hermes solo contesta a Oscar y a quien tenga user_id aqui; sin user_id (null) no se le contesta.
# Lo lee agent_lanes/people.py. Decision de Oscar 11-10: Ingerber (CMO Pildora), Andrea (marketing) y Maria (socia/estrategia).
#
# Reglas (las aplica el codigo, no este fichero):
#   - Oscar (owner) NO se declara aqui: su id es OWNER_TELEGRAM_ID (agent_lanes/decisions.py). Una entrada con
#     role: owner se ignora.
#   - Una entrada sin user_id (null) se IGNORA: la persona recibe el rechazo de "no conocida" hasta que se rellene.
#   - Capacidades por rol (fijas en codigo): coo/cmo/marketing = consulta, estado, idea, contenido.
#     `can` solo admite `carril` y solo para coo; hoy esta RESERVADO: aunque se active, todo DM de un no-owner
#     sigue creando una tarjeta [IDEA] asignada a oscar, nunca una tarea de carril ejecutable.
#   - `operador: true` (booleano estricto) = MISMO acceso que Oscar al bot de carriles: comandos, botones y
#     aprobaciones (/aprobar, /desplegar, botones int_*, fusionar, migraciones...), por DM y en grupo. Decision de
#     Oscar 19-10: hoy SOLO Maria. Sus acciones quedan firmadas con su nombre en el comentario de la tarjeta.
#     Sin `operador: true` (Ingerber, Andrea) el acceso sigue siendo solo el DM de ideas.
#   - `permisos: [aprobar_produccion]` = puede dar el OK con botón a las acciones de producción del carril integrador
#     (fusionar a main/master, desplegar, migraciones, variables de entorno; ver specs/carril-integrador-telegram.md).
#     Decisión de Oscar 22-10: Oscar (owner, implícito), María y Angel, en TODAS las marcas para este permiso (no
#     depende de `brands`). Lo lee People.puede_aprobar_produccion; el resto de permisos del YAML se ignoran.
#   - Tras rellenar un user_id (Oscar, a mano): la persona envia /start al bot. Ya NO hace falta copiarlo a
#     TELEGRAM_ALLOWED_CHATS del .env: la allowlist del bot de carriles se deriva de este fichero + lanes.yaml (F1-02,
#     agent_lanes/telegram.allowlist). NO anadirlo a generic_origins de lanes.yaml.
#   - brands: la primera marca decide el tablero de sus tarjetas (Pildora -> oscarhq, MigraTeam -> migrateam). Ademas
#     limita lo que ejecuta un operador: solo actua (comandos, botones, aprobaciones, fusiones, despliegues) en esas
#     marcas; "*" = todas (Maria). Sin "*" y sin marca clara en el destino, se rechaza. OscarHQ cuenta como Pildora.
#     Limite conocido (pendiente de Oscar): los listados (/tareas, /estado...) aun muestran tarjetas de otras marcas;
#     solo se veta ACTUAR sobre ellas. /ajustes, /integrador, /sesion... quedan reservados a quien tiene "*".
people:
  maria:
    name: María
    user_id: "5516823836"   # María (socia/estrategia, acceso como Oscar salvo produccion); dado por Oscar 13-10
    role: coo
    brands: [Píldora, MigraTeam, "*"]   # "*" = opera en TODAS las marcas (la primera decide el tablero de sus ideas)
    can: []         # [carril] reservado; desactivado por defecto
    operador: true  # mismo acceso que Oscar en el bot de carriles (comandos, botones, aprobaciones); decision de Oscar 19-10
    permisos: [aprobar_produccion]  # OK con boton a produccion del carril integrador; decision de Oscar 22-10
  ingerber:
    name: Ingerber
    user_id: "8847860660"   # Ingerber (CMO Pildora); confirmado por nombre en los registros 13-10
    hermes: false   # 24-10 (Oscar): sin Hermes hasta tener un Hermes de equipo sin terminal ni ficheros
    role: cmo
    brands: [Píldora]
    can: []
  andrea:
    name: Andrea
    user_id: "8313932936"   # Andrea (marketing, a prueba); dado por Oscar 13-10
    hermes: false   # 24-10 (Oscar): sin Hermes hasta tener un Hermes de equipo sin terminal ni ficheros
    role: marketing
    brands: [Píldora]
    can: []
  mauredy:
    name: Mauredy
    user_id: null   # PENDIENTE - rellenar cuando Oscar confirme el Telegram ID (atencion cliente + desarrollo MigraTeam)
    role: dev
    brands: [MigraTeam]   # SOLO MigraTeam
    can: []
    operador: true  # acotado: solo actua en las marcas de `brands` (el codigo rechaza el resto); decision de Oscar 21-10
  angel:
    name: Angel
    user_id: "8770041085"   # Angel (CTO OscarHQ + Signal); chat_id/DM dado por Oscar 21-10
    role: dev
    brands: [Píldora, Signal, Hub]   # D9 (26-10): decide también el Hub. SIN MigraTeam; sin credenciales Railway/Supabase/Vercel
    can: []
    # OK final de Oscar el 22-10 (consola del integrador): operador acotado a Pildora (=OscarHQ) y Signal por el veto
    # de marca (#72). Nada en MigraTeam ni en lo demas.
    operador: true
    permisos: [aprobar_produccion]  # todas las marcas para este permiso (no depende de brands); decision de Oscar 22-10
